name: Build signed Google Play AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: Generate Android app icons
        run: npx capacitor-assets generate --android

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 GitHub secret" && exit 1)
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/upload-key.jks
          cat > android/keystore/signing.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Configure release signing and API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if 'signing.properties' not in s:
              prefix='''def signingProps = new Properties()\ndef signingFile = rootProject.file("keystore/signing.properties")\nif (signingFile.exists()) { signingProps.load(new FileInputStream(signingFile)) }\n\n'''
              s=prefix+s
              s=s.replace('android {', 'android {\n    compileSdk 36', 1)
              s=s.replace('defaultConfig {', 'defaultConfig {\n        targetSdk 36', 1)
              signing='''signingConfigs {\n        release {\n            if (signingFile.exists()) {\n                storeFile file("../keystore/upload-key.jks")\n                storePassword signingProps['storePassword']\n                keyAlias signingProps['keyAlias']\n                keyPassword signingProps['keyPassword']\n            }\n        }\n    }\n\n    '''
              s=s.replace('buildTypes {', signing+'buildTypes {', 1)
              s=s.replace('release {', 'release {\n            signingConfig signingConfigs.release', 1)
          p.write_text(s)
          PY

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: DZ-LIFE-release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
